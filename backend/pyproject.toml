[project]
name = "antam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "mangum>=0.19",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]   # T20 = cấm print() trong code
ignore = ["B008", "UP046"]  # B008: FastAPI File()/Form() là idiom chuẩn; UP046: giữ Generic cho pydantic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
