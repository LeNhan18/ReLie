AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AnTam backend - FastAPI tren Lambda qua HTTP API, DynamoDB on-demand, ngan sach $20

Parameters:
  BedrockModelExtract:
    Type: String
    Description: Model ID (vision) dung de trich xuat hop dong - kiem tra co san o region
  BedrockModelWrite:
    Type: String
    Description: Model ID nho dung de viet loi giai thich
  BudgetEmail:
    Type: String
    Description: Email nhan canh bao ngan sach

Globals:
  Function:
    Runtime: python3.12
    Timeout: 29
    MemorySize: 1024
    Architectures: [arm64]

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 5
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
        AllowHeaders: ["*"]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: antam.main.handler
      Environment:
        Variables:
          AI_MODE: bedrock
          BEDROCK_MODEL_EXTRACT: !Ref BedrockModelExtract
          BEDROCK_MODEL_WRITE: !Ref BedrockModelWrite
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: ["bedrock:InvokeModel"]
              Resource: "*"
      Events:
        All:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /{proxy+}, Method: ANY }

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: antam-20usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 20, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 25 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 75 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
